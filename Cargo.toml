[package]
name = "fast-disambig"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast Arabic morphological disambiguation and stemming"
readme = "README.md"

[workspace]
members = ["bindings/python", "bindings/node"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/hadikhamoud/fast-disambig"

[lib]
name = "fast_disambig"
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
fs2 = "0.4.3"
rand = "0.8.5"
rayon = "1.11.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.23.0"
ureq = "3.2.0"
zip = "8.2.0"
