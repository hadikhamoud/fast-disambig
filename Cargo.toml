[package]
name = "fast-disambig"
version = "0.1.4"
edition = "2024"

[lib]
name = "fast_disambig"
crate-type = ["cdylib", "rlib"]



[features]
default = []
python = ["pyo3"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
pyo3 = { version = "0.25", features = ["extension-module"], optional = true }
rand = "0.8.5"
rayon = "1.11.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
ureq = "3.2.0"
zip = "8.2.0"

